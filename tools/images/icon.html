<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
* { margin: 0; }
html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
/* Квадрат без скругления: iOS и поисковики сами скругляют иконку */
.tile { width: 512px; height: 512px; background: #0d0f0e; display: grid; place-items: center; }
svg { width: 360px; height: 360px; }
</style>
</head>
<body>
<div class="tile">
  <svg viewBox="0 0 32 32"><path d="M7.5 10.5 16 25 22.5 14" fill="none" stroke="#F4F5F3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="9.5" r="4.6" fill="#1A8754"/></svg>
</div>
</body>
</html>
