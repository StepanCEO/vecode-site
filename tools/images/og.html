<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Onest; font-weight: 100 900; src: url("../../assets/fonts/onest-cyrillic-wght-normal.woff2") format("woff2"); unicode-range: U+0400-045F; }
@font-face { font-family: Onest; font-weight: 100 900; src: url("../../assets/fonts/onest-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: JBM; font-weight: 100 800; src: url("../../assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: JBM; font-weight: 100 800; src: url("../../assets/fonts/jetbrains-mono-cyrillic-wght-normal.woff2") format("woff2"); unicode-range: U+0400-045F; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #f4f5f3; color: #0d0f0e; font-family: Onest, sans-serif; position: relative; }
.wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
.logo { display: flex; align-items: center; gap: 16px; }
.logo svg { width: 54px; height: 54px; }
.logo b { font-size: 50px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; padding-bottom: 6px; }
h1 { margin-top: auto; font-size: 74px; font-weight: 500; letter-spacing: -0.045em; line-height: 1; max-width: 900px; }
h1 em { font-style: normal; color: #1a8754; }
.tags { margin-top: 30px; font-family: JBM, monospace; font-size: 22px; letter-spacing: 0.02em; color: rgba(13,15,14,.6); }
.domain { position: absolute; right: 72px; top: 76px; font-family: JBM, monospace; font-size: 22px; color: rgba(13,15,14,.6); }
.graph { position: absolute; right: -40px; bottom: -40px; width: 420px; height: 420px; opacity: .9; }
</style>
</head>
<body>
<svg class="graph" viewBox="0 0 420 420" fill="none" aria-hidden="true">
  <g stroke="rgba(13,15,14,.14)" stroke-width="1.5">
    <path d="M60 80 200 50 330 150 140 220 300 310 120 380"/>
    <path d="M200 50 380 40M330 150 400 230M140 220 40 260M300 310 410 380"/>
  </g>
  <path d="M60 80 200 50 330 150 140 220" stroke="#1a8754" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f4f5f3" stroke="#0d0f0e" stroke-width="2.5">
    <circle cx="60" cy="80" r="9"/><circle cx="200" cy="50" r="9"/><circle cx="330" cy="150" r="9"/><circle cx="300" cy="310" r="9"/><circle cx="120" cy="380" r="13"/>
  </g>
  <circle cx="140" cy="220" r="11" fill="#1a8754"/>
</svg>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none"><path d="M5 8.5 14 23 21 11.5" stroke="#0d0f0e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22.5" cy="7.5" r="4.2" fill="#1A8754"/></svg>
    <b>vecode</b>
  </div>
  <h1>Студия разработки <em>полного цикла</em></h1>
  <p class="tags">Сайты · Чат-боты · CRM · AI-агенты · Приложения · Интеграции</p>
</div>
<p class="domain">vecode.tech</p>
</body>
</html>
